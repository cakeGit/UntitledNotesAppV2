<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React App</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Updated src to point to your actual entry file -->
    <script type="module" src="/src/index.jsx"></script>
    <!--
      globally disable pasing content into contenteditable
      Source: https://stackoverflow.com/questions/58980235/stop-pasting-html-style-in-a-contenteditable-div-only-paste-the-plain-text
    -->
    <script>
      var ce = document.querySelector('[contenteditable]')
      ce.addEventListener('paste', function (e) {
        e.preventDefault()
        var text = e.clipboardData.getData('text/plain')
        document.execCommand('insertText', false, text)
      })
    </script>
  </body>
</html>
